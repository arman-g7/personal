<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arman Payandeh</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/theme.js"></script>
</head>
<body data-i18n-title="post.title">

<div class="wrap">

  <header class="masthead">
    <p class="name"><a href="../" data-i18n="site.name">Arman Payandeh</a></p>
    <nav>
      <a href="./" data-i18n="nav.blog">Blog</a>
      <button type="button" id="lang-toggle" class="toggle" data-shows="fa">فارسی</button>
      <button type="button" id="theme-toggle" class="toggle">Dark</button>
    </nav>
  </header>

  <main>
    <article id="post">
      <div class="post-header">
        <h1 id="post-title"></h1>
        <span class="post-meta" id="post-date"></span>
      </div>
      <div id="post-body"></div>
    </article>

    <p><a class="back" href="./" data-i18n="post.back">← Back to blog</a></p>
  </main>

  <footer class="footer">
    <p data-i18n="footer.built">Just a few files of HTML, CSS, and a little
    JavaScript. <a href="https://github.com/arman-g7/personal">Source</a>.</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/render-md.js"></script>
</body>
</html>
